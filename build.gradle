plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"villager-news-addon-port" {
			sourceSet sourceSets.main
		}
		"villager-news-addon-port-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// headless game test server
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// dev only screenshot client using run/saves/vnap-visual-test
		visualTest {
			client()
			name = "Visual Test"
			vmArg "-Dvnap.visualTest=true"
			programArgs "--quickPlaySingleplayer", "vnap-visual-test"
			source sourceSets.gametest
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "TerraformersMC"
				url = "https://maven.terraformersmc.com/releases/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly "maven.modrinth:4I1XuqiY:${project.emf_version}"
	modCompileOnly "maven.modrinth:BVzZfTc1:${project.etf_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	modLocalRuntime "maven.modrinth:4I1XuqiY:${project.emf_version}"
	modLocalRuntime "maven.modrinth:BVzZfTc1:${project.etf_version}"
	modLocalRuntime "maven.modrinth:IMuO8COj:${project.esf_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def dialogueTestCommand = project.findProperty("dialogue_test_command")?.toString()?.toBoolean() ?: false
	inputs.property "version", version
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "dialogue_test_command", dialogueTestCommand

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": minecraftVersion
	}

	filesMatching("villager-news-addon-port-build.properties") {
		expand "dialogue_test_command": dialogueTestCommand
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
